apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
data:
  APP_PORT: "8080"
  WORKER_COUNT: "4"
  QUEUE_SIZE: "200"
  MAIL_FROM: "no-reply@mongols.app"
  MAIL_FROM_NAME: "Mongols App"
  RESEND_ENDPOINT: "https://api.resend.com/emails"
  BREVO_ENDPOINT: "https://api.brevo.com/v3/smtp/email"
